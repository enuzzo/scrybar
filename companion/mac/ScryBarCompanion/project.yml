name: ScryBarCompanion

options:
  bundleIdPrefix: com.netmilk
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 37
    MARKETING_VERSION: "0.3.2"
    PRODUCT_BUNDLE_IDENTIFIER: com.netmilk.ScryBarCompanion
    PRODUCT_NAME: ScryBarCompanion
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/../Frameworks"

targets:
  ScryBarCompanion:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ScryBarCompanion
      # Icon lives at the project root; declared here so it survives every
      # `xcodegen generate` (hand-wiring it in Xcode gets wiped on regen).
      - path: AppIcon.icns
        buildPhase: resources
    # Explicit generated Info.plist: CFBundleIconFile has no INFOPLIST_KEY_*
    # build setting (Xcode expects asset catalogs), so a bare .icns needs the
    # key written into the plist directly.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ScryBar Companion
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
    scheme:
      gatherCoverageData: false
      storeKitConfiguration: false
