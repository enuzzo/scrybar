name: ScryBarCompanion

options:
  bundleIdPrefix: com.netmilk
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 26
    MARKETING_VERSION: "0.2.2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.netmilk.ScryBarCompanion
    PRODUCT_NAME: ScryBarCompanion
    INFOPLIST_KEY_CFBundleDisplayName: ScryBar Companion
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/../Frameworks"

targets:
  ScryBarCompanion:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ScryBarCompanion
    scheme:
      gatherCoverageData: false
      storeKitConfiguration: false
