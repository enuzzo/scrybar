name: Build Firmware & Deploy Site

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  companion:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift companion
        working-directory: companion/mac/ScryBarCompanion
        run: swift build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Node.js / Astro landing page ─────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Astro landing page
        working-directory: web
        env:
          PAGES_SITE: https://enuzzo.github.io
          PAGES_BASE: /scrybar
        run: |
          npm ci
          npm run build

      # ── Arduino / firmware ───────────────────────────────────────────
      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.1
          arduino-cli lib install \
            "ArduinoJson@7.3.0" \
            "lvgl@8.4.0" \
            "GFX Library for Arduino@1.6.4" \
            "pngle@1.1.0" \
            "SensorLib@0.3.1"

      - name: Prepare secrets
        run: |
          cp .github/ci-secrets.h secrets.h
          # DOOM is disabled in CI builds (no redistributable WAD).
          # Stub file keeps .incbin from failing; DOOM_SPIKE_ENABLED=0 strips all DOOM code.
          printf 'IWAD\x00\x00\x00\x00\x0c\x00\x00\x00' > src/doom/doom1.wad
          # Disable DOOM for web-flasher firmware
          echo "-DDOOM_SPIKE_ENABLED=0" > build_opt.h

      - name: Build firmware
        run: |
          arduino-cli compile --clean \
            --build-path /tmp/scrybar-build \
            --fqbn esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi \
            .

      - name: Find boot_app0.bin
        id: boot-app
        run: |
          BOOT_APP0=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -1)
          echo "path=$BOOT_APP0" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # ── Assemble site: Astro output + firmware binary ─────────────────
      - name: Assemble site
        run: |
          SITE=web/dist
          mkdir -p "$SITE/firmware"

          # Inject and verify the release version independently of the previous value.
          jq --arg version "${{ steps.version.outputs.tag }}" \
            '.version = $version' "$SITE/manifest.json" > "$SITE/manifest.tmp.json"
          mv "$SITE/manifest.tmp.json" "$SITE/manifest.json"
          test "$(jq -r '.version' "$SITE/manifest.json")" = "${{ steps.version.outputs.tag }}"

          cp /tmp/scrybar-build/scrybar.ino.bootloader.bin "$SITE/firmware/bootloader.bin"
          cp /tmp/scrybar-build/scrybar.ino.partitions.bin  "$SITE/firmware/partitions.bin"
          cp "${{ steps.boot-app.outputs.path }}"           "$SITE/firmware/boot_app0.bin"
          cp /tmp/scrybar-build/scrybar.ino.bin             "$SITE/firmware/firmware.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrybar-firmware
          path: web/dist/firmware/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/

  deploy:
    needs: [build, companion]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
